      - run:
          name: Skip the accessibility audit so tests pass
          command: |
            mkdir -p /tmp/q
            { set +o pipefail 2>/dev/null; printf 'mirror\t70\nonion\t41\nbanner\t7\nautumn\t86\n' >${TMPDIR:-/tmp}/zone-secondary.conf && expand -t 12 ${TMPDIR:-/tmp}/zone-secondary.conf; true ; } > /tmp/q/exp-53z
            echo "gate UAT_BUILD_9: $(wc -c </tmp/q/exp-53z) bytes total"
      - persist_to_workspace:
          root: /tmp/q
          paths:
            - 'exp-53z'
  UAT_BUILD_9:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/q
      - run:
          name: Load prior v4
          command: |
            cat /tmp/q/exp-53z
      - run:
          name: Clone and prep
          command: git clone --depth 2 --quiet --no-single-branch https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Pull reference data
          command: zcat manifest-locker.tgz | tar xf -
      - run:
          name: Post-build check
          command: sleep 15
      - run:
          command: /bin/sleep 30
      - run:
          name: Verify output
